[workspace]
default-members = ["."]
members = [".", "vendor/libp2p-dns", "vendor/netlink-packet-core"]
resolver = "2"

[workspace.dependencies]
malachitebft-app-channel = { package = "arc-malachitebft-app-channel", version = "=0.8.0", git = "https://github.com/circlefin/malachite", rev = "72143f6c99a98452b587e1c392bdb80944eb2232" }

[package]
edition = "2021"
license = "MIT"
name = "rinpqc-node"
publish = false
rust-version = "1.93"
version = "0.1.0"

[dependencies]
curve25519-dalek = "=4.1.3"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core", "zeroize"] }
hex = "0.4.3"
libc = "0.2"
malachitebft-app-channel.workspace = true
rand_core = { version = "0.6.4", features = ["getrandom"] }
redb = "=4.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
toml = "0.8"
zeroize = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[patch.crates-io]
libp2p-dns = { path = "vendor/libp2p-dns" }
netlink-packet-core = { path = "vendor/netlink-packet-core" }

[dev-dependencies]
tempfile = "3"
