name: Rust
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - name: Install pinned Rust and formatter
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component clippy --component rust-analyzer --component rustfmt
          rustup toolchain install nightly-2026-01-23 --profile minimal --component rustfmt
      - name: Install verified quality tools
        run: bash scripts/install-ci-tools.sh
      - name: Quality gate
        run: just check
      - name: Verify devnet initialization
        run: python3 scripts/devnet/test_setup.py

  devnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: rinpqc-test-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Exercise disposable four-node devnet
        run: python3 scripts/devnet/smoke.py
      - name: Collect logs and remove test resources
        if: always()
        run: |
          docker compose logs --no-color --tail 200
          docker compose down --volumes
