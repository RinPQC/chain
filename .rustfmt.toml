# Basic
edition = "2021"
hard_tabs = true
max_width = 100
use_small_heuristics = "Max"
# Imports (requires the pinned nightly formatter)
imports_granularity = "Crate"
reorder_imports = true
# Consistency
match_block_trailing_comma = true
newline_style = "Unix"
trailing_comma = "Vertical"
use_field_init_shorthand = true
# Comments (nightly-only)
comment_width = 100
wrap_comments = true
